index index.php;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

location = /healthz { access_log off; return 200 "healthy\n"; }
location /assets/ { alias /srv/assets/; }
location ~ /\. { deny all; }
location / { try_files $uri $uri/ =404; }

location ~ \.php$ {
    # Existence is checked by NGINX; never pass a nonexistent script to FPM.
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    fastcgi_param HTTP_PROXY "";
    resolver 127.0.0.11 valid=10s ipv6=off;
    fastcgi_pass $php_backend;
    fastcgi_connect_timeout 3s;
    fastcgi_read_timeout 30s;
}
