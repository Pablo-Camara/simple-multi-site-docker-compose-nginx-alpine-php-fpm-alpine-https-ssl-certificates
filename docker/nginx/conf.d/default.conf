# Reject unknown hosts instead of serving a tenant by accident.
server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/snippets/tls.conf;
    location = /healthz { access_log off; return 200 "healthy\n"; }
    location / { return 404; }
}

server {
    listen 8080;
    server_name site-one.localhost site-one.com www.site-one.com;
    root /srv/site-one;
    set $php_backend site-one-php:9000;
    include /etc/nginx/snippets/site.conf;
    include /etc/nginx/snippets/tls.conf;
}

server {
    listen 8080;
    server_name site-two.localhost site-two.com www.site-two.com;
    root /srv/site-two;
    set $php_backend site-two-php:9000;
    include /etc/nginx/snippets/site.conf;
    include /etc/nginx/snippets/tls.conf;
}
