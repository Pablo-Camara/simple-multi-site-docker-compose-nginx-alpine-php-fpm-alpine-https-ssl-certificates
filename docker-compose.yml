name: php-multisite

x-php: &php
  build: ./docker/php-fpm
  user: "82:82"
  read_only: true
  mem_limit: 256m
  pids_limit: 100
  tmpfs:
    - /tmp:mode=1777,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong",
      ]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  site-one-php:
    <<: *php
    volumes:
      - ./sites/site-one.com/root/public:/var/www/html:ro
    networks: [site-one]

  site-two-php:
    <<: *php
    volumes:
      - ./sites/site-two.com/root/public:/var/www/html:ro
    networks: [site-two]

  nginx:
    build: ./docker/nginx
    read_only: true
    mem_limit: 128m
    pids_limit: 100
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./sites/site-one.com/root/public:/srv/site-one:ro
      - ./sites/site-two.com/root/public:/srv/site-two:ro
      - ./sites/assets:/srv/assets:ro
    networks: [edge, site-one, site-two]
    depends_on:
      site-one-php:
        condition: service_healthy
      site-two-php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# Workers have no shared network or source mount. NGINX is the only shared edge.
networks:
  edge: {}
  site-one:
    internal: true
  site-two:
    internal: true
